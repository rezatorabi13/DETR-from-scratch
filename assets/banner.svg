<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="DETR from Scratch: end-to-end object detection with transformers">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1222"/>
      <stop offset="0.6" stop-color="#141B36"/>
      <stop offset="1" stop-color="#1E1846"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#7048E8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7048E8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="tokens" width="22" height="22" patternUnits="userSpaceOnUse">
      <rect x="1.5" y="1.5" width="19" height="19" rx="3" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <!-- Title block -->
  <g font-family="Segoe UI, -apple-system, Helvetica Neue, Arial, sans-serif">
    <text x="64" y="128" fill="#FFFFFF" font-size="58" font-weight="700" letter-spacing="-0.5">DETR from Scratch</text>
    <text x="66" y="172" fill="#B9C2DC" font-size="22">End-to-end object detection with transformers, in plain PyTorch</text>

    <g font-size="15" font-weight="600">
      <rect x="64" y="208" width="118" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="123" y="230" fill="#E6E9F5" text-anchor="middle">No anchors</text>
      <rect x="194" y="208" width="96" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="242" y="230" fill="#E6E9F5" text-anchor="middle">No NMS</text>
      <rect x="302" y="208" width="196" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="400" y="230" fill="#E6E9F5" text-anchor="middle">Hungarian matching</text>
      <rect x="510" y="208" width="176" height="34" rx="17" fill="#7048E8" fill-opacity="0.25" stroke="#9775FA" stroke-opacity="0.7"/>
      <text x="598" y="230" fill="#E5DBFF" text-anchor="middle">VOC mAP@0.5 0.725</text>
    </g>
  </g>

  <!-- Object queries -->
  <g>
    <circle cx="812" cy="92"  r="9" fill="#2B8A3E"/>
    <circle cx="812" cy="128" r="9" fill="#E8590C"/>
    <circle cx="812" cy="164" r="9" fill="#7048E8"/>
    <circle cx="812" cy="200" r="9" fill="#FFFFFF" fill-opacity="0.18"/>
    <circle cx="812" cy="236" r="9" fill="#FFFFFF" fill-opacity="0.18"/>
    <text x="812" y="276" fill="#8B93B0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">queries</text>
  </g>

  <!-- Image token grid -->
  <rect x="890" y="56" width="330" height="220" rx="10" fill="#0E1428" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <rect x="890" y="56" width="330" height="220" rx="10" fill="url(#tokens)"/>

  <!-- Attention links from queries to their objects -->
  <g fill="none" stroke-width="2" stroke-linecap="round">
    <path d="M821 92 C 900 36, 1060 36, 1140 98" stroke="#40C057" stroke-opacity="0.8"/>
    <path d="M821 128 C 860 128, 890 128, 932 128" stroke="#E8590C" stroke-opacity="0.8"/>
    <path d="M821 164 C 900 172, 980 204, 1040 204" stroke="#9775FA" stroke-opacity="0.8"/>
    <path d="M821 200 C 850 205, 870 215, 890 222" stroke="#FFFFFF" stroke-opacity="0.12" stroke-dasharray="3 5"/>
    <path d="M821 236 C 850 238, 870 245, 890 250" stroke="#FFFFFF" stroke-opacity="0.12" stroke-dasharray="3 5"/>
  </g>

  <!-- Predicted boxes -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">
    <rect x="918" y="96" width="78" height="64" rx="3" fill="#E8590C" fill-opacity="0.14" stroke="#E8590C" stroke-width="3"/>
    <rect x="918" y="78" width="72" height="20" rx="3" fill="#E8590C"/>
    <text x="924" y="93" fill="#FFFFFF">bird 0.98</text>

    <rect x="1010" y="160" width="110" height="94" rx="3" fill="#7048E8" fill-opacity="0.14" stroke="#9775FA" stroke-width="3"/>
    <rect x="1010" y="142" width="64" height="20" rx="3" fill="#7048E8"/>
    <text x="1016" y="157" fill="#FFFFFF">cat 1.00</text>

    <rect x="1112" y="76" width="92" height="74" rx="3" fill="#2B8A3E" fill-opacity="0.16" stroke="#40C057" stroke-width="3"/>
    <rect x="1132" y="58" width="72" height="20" rx="3" fill="#2B8A3E"/>
    <text x="1138" y="73" fill="#FFFFFF">dog 0.97</text>
  </g>
</svg>
